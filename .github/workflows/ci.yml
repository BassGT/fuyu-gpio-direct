name: CI Build & Haddock Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Haskell (GHC & Cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8.4'
          cabal-version: 'latest'

      - name: Install C libgpiod-dev dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpiod-dev

      - name: Update Cabal index
        run: cabal update

      - name: Build Package
        run: cabal build

      - name: Run Cabal Check
        run: cabal check

      - name: Verify Haddock Documentation
        run: cabal haddock --haddock-hyperlinked-source
