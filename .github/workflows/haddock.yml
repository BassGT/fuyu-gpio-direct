name: Deploy Haddock Docs to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Haskell (GHC & Cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8.4'
          cabal-version: 'latest'

      - name: Install C libgpiod-dev dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpiod-dev

      - name: Update Cabal index
        run: cabal update

      - name: Generate Haddock Documentation
        run: |
          cabal haddock --haddock-hyperlinked-source

      - name: Prepare HTML Output Directory
        run: |
          mkdir -p public
          cp -r dist-newstyle/build/x86_64-linux/ghc-*/fuyu-gpio-direct-*/doc/html/fuyu-gpio-direct/* public/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
